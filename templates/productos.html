<table id="tablaProductos" class="table table-striped table-dark table-hover">

    <thead>
        <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

    {% for p in productos %}

        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.codigo }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.categoria }}</td>
            <td>${{ "%.2f"|format(p.precio) }}</td>
            <td>{{ p.stock }}</td>

            <td>
                <a href="/productos/editar/{{ p.id }}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="/productos/eliminar/{{ p.id }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este producto?')">
                    Eliminar
                </a>
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>
