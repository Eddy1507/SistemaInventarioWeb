{% extends 'base.html' %}


{% block contenido %}


<h2>Clientes</h2>


<hr>



<a href="/clientes/nuevo" class="btn btn-primary mb-3">

    Nuevo Cliente

</a>





<div class="table-responsive">



<table 

id="tablaClientes"

class="table table-striped table-hover tabla nowrap"

style="width:100%">



<thead class="table-dark">



<tr>


<th>ID</th>

<th>Nombre</th>

<th>Teléfono</th>

<th>Correo</th>

<th>Acciones</th>



</tr>



</thead>





<tbody>




{% for c in clientes %}




<tr>



<td>

{{ c.id }}

</td>




<td>

{{ c.nombre }}

</td>




<td>

{{ c.telefono }}

</td>




<td>

{{ c.correo }}

</td>




<td>




<a href="/clientes/editar/{{ c.id }}"

class="btn btn-warning btn-sm">


Editar


</a>






<a href="/clientes/eliminar/{{ c.id }}"

class="btn btn-danger btn-sm"

onclick="return confirm('¿Eliminar este cliente?')">


Eliminar


</a>




</td>




</tr>




{% endfor %}





</tbody>




</table>



</div>





{% endblock %}





{% block scripts %}



<script>


$(document).ready(function(){



$('#tablaClientes').DataTable({



responsive:false,


scrollX:true,


autoWidth:false,



pageLength:10,



language:{



search:"Buscar:",



lengthMenu:"Mostrar _MENU_ registros",



info:"Mostrando _START_ a _END_ de _TOTAL_ registros",



zeroRecords:"No se encontraron registros",



paginate:{



previous:"Anterior",


next:"Siguiente"



}



}



});



});



</script>



{% endblock %}
