{% extends 'base.html' %}

{% block contenido %}

<h2>Editar Producto</h2>

<form method="POST">

<div class="mb-3">
<label>Código</label>
<input class="form-control" name="codigo" value="{{ producto.codigo }}">
</div>

<div class="mb-3">
<label>Nombre</label>
<input class="form-control" name="nombre" value="{{ producto.nombre }}">
</div>

<div class="mb-3">
<label>Categoría</label>
<input class="form-control" name="categoria" value="{{ producto.categoria }}">
</div>

<div class="mb-3">
<label>Precio</label>
<input class="form-control" type="number" step="0.01" name="precio" value="{{ producto.precio }}">
</div>

<div class="mb-3">
<label>Stock</label>
<input class="form-control" type="number" name="stock" value="{{ producto.stock }}">
</div>

<button class="btn btn-warning">
Actualizar
</button>

<a href="/productos" class="btn btn-secondary">
Cancelar
</a>

</form>

{% endblock %}
