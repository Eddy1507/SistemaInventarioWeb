{% extends 'base.html' %}

{% block contenido %}

<h2>Nuevo Producto</h2>

<form method="POST">

<div class="mb-3">
<label>Código</label>
<input class="form-control" name="codigo" required>
</div>

<div class="mb-3">
<label>Nombre</label>
<input class="form-control" name="nombre" required>
</div>

<div class="mb-3">
<label>Categoría</label>
<input class="form-control" name="categoria">
</div>

<div class="mb-3">
<label>Precio</label>
<input class="form-control" type="number" step="0.01" name="precio">
</div>

<div class="mb-3">
<label>Stock</label>
<input class="form-control" type="number" name="stock">
</div>

<button class="btn btn-success">
Guardar Producto
</button>

<a href="/productos" class="btn btn-secondary">
Cancelar
</a>

</form>

{% endblock %}
